<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<style>
			:root {
				--page-bg-1: #b9b0a2;
				--page-bg-2: #8fa4b2;
				--board-bg: #f3efe6;
			}

			body {
				margin: 0;
				background:
					radial-gradient(
						1200px 900px at 20% 10%,
						rgba(255, 255, 255, 0.35),
						rgba(255, 255, 255, 0) 55%
					),
					linear-gradient(135deg, var(--page-bg-1), var(--page-bg-2));
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					Helvetica,
					Arial,
					"Apple Color Emoji",
					"Segoe UI Emoji";
				color: rgba(0, 0, 0, 0.86);
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
